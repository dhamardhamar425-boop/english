version: '3.8'

services:
  app:
    build: .
    image: englishproject-laravel
    container_name: englishproject-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - APP_NAME=Portal Organisasi SMK
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://your-vercel-domain.vercel.app
      - DB_CONNECTION=sqlite
      - CACHE_STORE=file
      - QUEUE_CONNECTION=database
      - SESSION_DRIVER=file
      - FILESYSTEM_DISK=local
    ports:
      - "9000:9000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge